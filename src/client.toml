prefix = "Ctrl+a"
repeat_rate = 25
repeat_delay = 300
connections = []
notify = []

[bindings.normal]
"Alt+h" = "focus left"
"Alt+j" = "focus down"
"Alt+k" = "focus up"
"Alt+l" = "focus right"
"Alt+H" = "window prev"
"Alt+L" = "window next"
"Alt+s" = "zoom"
"Alt+t" = "ui sessions"
"Alt+y" = "window last"
"Alt+Y" = "session last"
"Alt+v" = "edit"

[bindings.prefix]
c = "window new"
"%" = "split h"
'"' = "split v"
Left = "focus left"
Down = "focus down"
Up = "focus up"
Right = "focus right"
o = "focus next"
j = "join"
x = "close"
"&" = "window close"
"1" = "window select 1"
"2" = "window select 2"
"3" = "window select 3"
"4" = "window select 4"
"5" = "window select 5"
"6" = "window select 6"
"7" = "window select 7"
"8" = "window select 8"
"9" = "window select 9"
"<" = "resize h -5"
">" = "resize h 5"
"-" = "resize v 5"
"+" = "resize v -5"
"_" = "resize v 5"
"=" = "resize v -5"
"Alt+Left" = "resize h -5"
"Alt+Right" = "resize h 5"
"Alt+Up" = "resize v -5"
"Alt+Down" = "resize v 5"
"Ctrl+Left" = "resize h -5"
"Ctrl+Right" = "resize h 5"
"Ctrl+Up" = "resize v -5"
"Ctrl+Down" = "resize v 5"
w = "ui windows"
s = "ui sessions"
S = "session new"
C = "ui connections"
":" = "ui command"
"," = "ui window-name"
"$" = "ui session-name"
P = "ui pane-name"
"?" = "ui help"
d = "detach"
Escape = "mode normal"
"Ctrl+g" = "mode normal"

[bindings.resize]
Left = "resize h -5"
Right = "resize h 5"
Up = "resize v -5"
Down = "resize v 5"
"Alt+Left" = "resize h -5"
"Alt+Right" = "resize h 5"
"Alt+Up" = "resize v -5"
"Alt+Down" = "resize v 5"
"Ctrl+Left" = "resize h -5"
"Ctrl+Right" = "resize h 5"
"Ctrl+Up" = "resize v -5"
"Ctrl+Down" = "resize v 5"
"<" = "resize h -5"
">" = "resize h 5"
"-" = "resize v 5"
"+" = "resize v -5"
"_" = "resize v 5"
"=" = "resize v -5"
Escape = "mode normal"
"Ctrl+g" = "mode normal"
